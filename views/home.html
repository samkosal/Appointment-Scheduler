<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src = "/js/appointment.js" defer></script>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <form id="Appointment" action="submit-order" method="post">
        <fieldset>
            <legend>Contact Info</legend>

            <span id="err-fname" class="error"> First Name cannot be empty!</span>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname">

            <span id="err-lname" class="error"> Last Name cannot be empty!</span>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname">

            <!-- <span id="err-date" class="error"> Date cannot be empty!</span> -->
            <label for="date">Date:</label>
            <input type="date" id="date" name="date">

            <!-- <span id="err-time" class="error"> Time cannot be empty!</span> -->
            <label for="time">Time:</label>
            <input type="time" id="time" name="time">

            <button type="submit" id="order-button"> Place Order</button>
        </fieldset> 
    </form>
</body>
</html>
